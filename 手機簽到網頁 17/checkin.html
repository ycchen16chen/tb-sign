<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>會議簽到</title>
<style>
:root{--ink:#14213d;--sub:#5b6472;--bg:#eef1f5;--card:#fff;--line:#d6dbe2;--acc:#1f5fae;--ok:#166534;--err:#b3261e;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:20px max(14px,env(safe-area-inset-left)) 40px max(14px,env(safe-area-inset-right))}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--sub);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.grp{font-size:13px;color:var(--sub);margin:6px 2px 0}
.who{font:inherit;font-size:19px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-height:56px;width:100%;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:8px}
.who small{font-size:12px;color:var(--red);white-space:nowrap}
.who.me{border-color:var(--ok);background:#ecfdf5}
button.b{font:inherit;font-size:17px;border:0;border-radius:10px;padding:13px;min-height:50px;width:100%;cursor:pointer}
.pri{background:var(--acc);color:#fff}.sec{background:#e5e7eb;color:var(--ink)}.red{background:#fdecea;color:var(--red);border:1px solid #f3c1bb!important}
button.b:disabled{opacity:.45}
.row{display:flex;gap:8px}.row>*{flex:1}
.big{font-size:19px;line-height:1.7}
.msg{font-size:14.5px;line-height:1.6;min-height:1.2em}.msg.err{color:var(--err)}
.note{font-size:12.5px;color:var(--sub);line-height:1.7}
.done{font-size:60px;text-align:center;line-height:1.1}
.stampbox{border:1px solid #f0d4d0;background:#fdf6f5;border-radius:12px;padding:12px;display:grid;gap:8px}
.stampbox img{max-height:80px;max-width:220px;background:#fff;border:1px solid #f0d4d0;border-radius:6px;padding:4px;justify-self:start}
label.cons{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.6}
label.cons input{width:20px;height:20px;flex:none;margin-top:2px}
.pad{position:relative;border:1px dashed #94a3b8;border-radius:10px;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;height:200px;touch-action:none}
.pad .base{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1px solid #cbd5e1;pointer-events:none}
.pad .ph{position:absolute;left:0;right:0;top:40%;text-align:center;color:#94a3b8;font-size:14px;pointer-events:none}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>結核病管理小組會議簽到</h1>
  <p class="sub" id="mt">請用手機相機掃描會議室螢幕上的 QR Code</p>
  <div class="card" id="box"></div>
  <p class="note" style="margin-top:12px">名單只顯示在這支手機上，不會送到網站。簽名或印章只傳給院內系統，院內收到後即從雲端刪除。</p>
</div>
<script>//---------------------------------------------------------------------
//

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

      png:function(){ if(!drawn) return null; var w=cv.width,h=cv.height,d=cv.getContext('2d').getImageData(0,0,w,h).data,x0=w,y0=h,x1=-1,y1=-1;
        for(var y=0;y<h;y+=2) for(var x=0;x<w;x+=2){ if(d[(y*w+x)*4+3]>0){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
        if(x1<0) return null; var m=10; x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(w,x1+m); y1=Math.min(h,y1+m);
        var sw=x1-x0, sh=y1-y0, sc=Math.min(1,600/sw,200/sh), o=document.createElement('canvas'); o.width=Math.max(1,Math.round(sw*sc)); o.height=Math.max(1,Math.round(sh*sc));
        o.getContext('2d').drawImage(cv,x0,y0,sw,sh,0,0,o.width,o.height); return o.toDataURL('image/png'); } };
  }
  // ---- 名單 ----
  // 院內系統公布的已簽到格位（只有代號）：院內刪除簽名後這裡也會變回未簽到
  var ST=null;
  function loadST(){ fetch('https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(PROJ)+'/databases/(default)/documents/'+encodeURIComponent(COL)+'/ST_'+encodeURIComponent(M))
      .then(function(r){ return r.ok?r.json():(r.status===404?{}:null); }).then(function(d){ if(!d) return; var v=d.fields&&d.fields.i&&d.fields.i.stringValue||''; var o={}; v.split(',').forEach(function(x){ if(x&&x!=='-') o[x]=1; });
        var was=JSON.stringify(ST); ST=o; var me=ls(MK); if(me&&!o[me]&&!/^a/.test(me)) ls(MK,''); if(was!==JSON.stringify(ST)&&box.querySelector('.who')) list(); }).catch(function(){}); }
  function list(){
    var me=ls(MK), mem=R.filter(function(r){ return r.s[0]==='m'; }), att=R.filter(function(r){ return r.s[0]!=='m'; });
    var h='<div class="big">請點選您的名字：</div>';
    var mt=+(ls(MK+'-t')||0); function signed(s){ return (ST&&ST[s])||(me===s&&(!ST||Date.now()-mt<90000)); }
    function btns(a){ return a.map(function(r){ return '<button class="who'+(signed(r.s)?' me':'')+'" data-s="'+esc(r.s)+'"><span>'+esc(r.n)+(signed(r.s)?'　✓ 已簽到':'')+'</span>'+(r.a?'<small>🔴 已授權印章</small>':'')+'</button>'; }).join(''); }
    if(mem.length) h+='<div class="grp">出席人員</div>'+btns(mem);
    var ADD=[]; try{ ADD=JSON.parse(sessionStorage.getItem('tbm-add-'+M)||'[]').filter(function(x){ return !R.some(function(r){ return r.n===x.n; }); }); }catch(e){}
    if(att.length||ADD.length) h+='<div class="grp">列席人員</div>'+btns(att)+ADD.map(function(x){ return '<div class="who me" style="cursor:default"><span>'+esc(x.n)+'　✓ 已簽到（新增）</span></div>'; }).join('');
    h+='<button class="b sec" id="addMe" style="margin-top:14px">＋ 名單上沒有我（新增姓名）</button>';
    box.innerHTML=h; $('addMe').onclick=addNew; if(!list._ld||Date.now()-list._ld>3000){ list._ld=Date.now(); loadST(); }
    [].forEach.call(box.querySelectorAll('.who'),function(b){ b.onclick=function(){ var r=R.filter(function(x){ return x.s===b.dataset.s; })[0]; if(r) (r.a?authorized(r):choose(r)); }; });
  }
  // 已授權印章：一鍵簽到，院內系統帶入印章
  function authorized(r){
    box.innerHTML='<div class="big"><b>'+esc(r.n)+'</b></div><div class="msg">您已授權電子印章，按「確認簽到」後院內系統會自動帶入您的印章。</div>'+
      '<button class="b pri" id="yes">確認簽到（帶入電子印章）</button><button class="b sec" id="hand">改用手寫簽名</button><button class="b sec" id="back">返回名單</button>';
    $('yes').onclick=function(){ send(r,{}); }; $('hand').onclick=function(){ choose(r); }; $('back').onclick=list;
  }
  // 未授權：手寫簽名，或拍照取得印章並授權
  function choose(r){
    box.innerHTML='<div class="big"><b>'+esc(r.n)+'</b>　簽到</div>'+
      '<div class="stampbox"><b>🔴 改用電子印章</b><span class="note" style="margin:0">（第一次使用需上傳並授權）</span>'+
        '<div class="row"><button class="b red" id="cam">📷 拍照印章</button><button class="b sec" id="pick">🖼 選擇圖片</button></div>'+
        '<input type="file" id="camIn" accept="image/*" capture="environment"><input type="file" id="picIn" accept="image/*">'+
        '<div class="note" style="margin:0">拍照時把蓋好的印章放在白紙上、光線充足、鏡頭正對印章；系統會自動抓出紅色印文、去掉背景並裁切。</div>'+
        '<div id="stPrev" hidden><img id="stImg" alt="印章預覽"></div>'+
        '<label class="cons" id="consL" hidden><input type="checkbox" id="cons"><span>我是 <b>'+esc(r.n)+'</b> 本人（或經本人授權）。'+CONSENT+'（請於下方簽名框親筆簽名，作為授權紀錄）</span></label>'+
      '</div>'+
      '<div class="note" id="padTip">請用手指在框內簽名；手機橫放可以簽得比較大。</div><div id="padH"></div><div class="msg" id="msg"></div>'+
      '<div class="row"><button class="b sec" id="clr">重簽</button><button class="b sec" id="back">取消</button><button class="b pri" id="go" disabled>完成</button></div>';
    var stamp=null, P2=pad($('padH'),upd);
    function upd(){ $('go').disabled=!(P2.has()&&(!stamp||$('cons').checked)); $('go').textContent=stamp?'授權並簽到':'完成'; }
    $('clr').onclick=function(){ P2.clear(); }; $('back').onclick=list;
    $('cam').onclick=function(){ $('camIn').click(); }; $('pick').onclick=function(){ $('picIn').click(); };
    $('camIn').onchange=$('picIn').onchange=function(){ var f=this.files[0]; this.value=''; if(!f) return; $('msg').className='msg'; $('msg').textContent='處理中…';
      var im0=new Image(); im0.onload=function(){ $('msg').textContent=''; window.__cropImg(im0).then(function(im){ var u=null; try{ u=redInk(im); }catch(e){} URL.revokeObjectURL(im0.src);
        if(!u){ $('msg').className='msg err'; $('msg').textContent='照片裡找不到紅色印章，請在光線充足處、靠近一點重拍。'; return; }
        stamp=u; $('stImg').src=u; $('stPrev').hidden=false; $('consL').hidden=false; $('padTip').textContent='授權需要親筆簽名：請在下方框內簽名，作為授權紀錄。'; $('msg').textContent=''; upd(); },function(e){ URL.revokeObjectURL(im0.src); $('msg').className='msg'; $('msg').textContent=e.message; }); };
      im0.onerror=function(){ $('msg').className='msg err'; $('msg').textContent='讀不到這張照片，請再試一次。'; }; im0.src=URL.createObjectURL(f); };
    $('cons').onchange=upd;
    $('go').onclick=function(){ var sig=P2.png(); if(!sig) return; if(stamp) send(r,{i:stamp,w:'stamp',g:sig}); else send(r,{i:sig,w:'sig'}); };
  }
  // 名單上沒有的人：輸入姓名、燈號，手寫簽名 → 院內系統新增到列席人員
  function addNew(){
    box.innerHTML='<div class="big">新增姓名簽到</div><div class="note">請輸入姓名（可加職稱，例如：王小明醫師）與燈號，再於下方框內簽名。送出後會加到簽到單的「列席人員」。</div>'+
      '<label class="note" style="display:block;margin:10px 0 4px">姓名（含職稱）</label><input id="nn" maxlength="20" autocomplete="name" style="font:inherit;font-size:18px;width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px">'+
      '<label class="note" style="display:block;margin:10px 0 4px">燈號</label><input id="ne" maxlength="16" autocapitalize="characters" style="font:inherit;font-size:18px;width:100%;box-sizing:border-box;padding:12px;border:1px solid #cbd5e1;border-radius:10px;text-transform:uppercase">'+
      '<div class="note" style="margin-top:12px">請用手指在框內簽名；手機橫放可以簽得比較大。</div><div id="padH"></div><div class="msg" id="msg"></div>'+
      '<div class="row"><button class="b sec" id="clr">重簽</button><button class="b sec" id="back">取消</button><button class="b pri" id="go" disabled>完成</button></div>';
    var P3=pad($('padH'),upd);
    function upd(){ $('go').disabled=!(P3.has()&&$('nn').value.trim()&&$('ne').value.trim()); }
    $('nn').oninput=$('ne').oninput=upd; $('clr').onclick=function(){ P3.clear(); }; $('back').onclick=list;
    $('go').onclick=function(){ var nm=$('nn').value.trim().slice(0,20), no=$('ne').value.trim().toUpperCase().slice(0,16), sig=P3.png();
      if(!nm||!no||!sig){ $('msg').className='msg err'; $('msg').textContent='請輸入姓名、燈號並簽名。'; return; }
      send({s:'a'+(Date.now()%100000),n:nm,add:1},{i:sig,w:'sig',n:nm,e:no}); };
    setTimeout(function(){ $('nn').focus(); },50);
  }
  function send(r,x){
    box.innerHTML='<div class="big">簽到中…</div>';
    var t=Date.now(), id=M+'_'+r.s+'_'+t.toString(36), F={m:{stringValue:M},h:{stringValue:''},s:{stringValue:r.s},t:{integerValue:String(t)},d:{stringValue:dev()},k:{stringValue:K}};
    ['i','w','g','n','e'].forEach(function(k){ if(x[k]) F[k]={stringValue:x[k]}; });
    fetch('https://firestore.googleapis.com/v1/projects/'+encodeURIComponent(PROJ)+'/databases/(default)/documents/'+encodeURIComponent(COL)+'?documentId='+encodeURIComponent(id),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:F})})
      .then(function(res){ if(res.ok||res.status===409) return; return res.text().then(function(tx){ throw new Error(res.status+' '+tx.slice(0,100)); }); })
      .then(function(){ ls(MK,r.s); ls(MK+'-t',String(Date.now())); if(r.add){ try{ var A=JSON.parse(sessionStorage.getItem('tbm-add-'+M)||'[]'); if(!A.some(function(x){ return x.n===r.n; })) A.push({s:r.s,n:r.n}); sessionStorage.setItem('tbm-add-'+M,JSON.stringify(A)); }catch(e){} } box.innerHTML='<div class="done">✅</div><div class="big" style="text-align:center">'+esc(r.n)+'<br>已送出簽到</div><div class="msg" style="text-align:center;color:var(--sub)">'+(x.w==='stamp'?'印章與授權已送出，院內系統收到後帶入印章。':x.w==='sig'?'簽名已送出。':'院內系統會帶入您的電子印章。')+'<br>請看會議室螢幕，出現您的名字即完成。</div><button class="b sec" id="back">回到名單查看簽到狀況</button>';
        $('back').onclick=list; })
      .catch(function(e){ box.innerHTML='<div class="big">送出失敗</div><div class="msg err">'+esc((e&&e.message)||'請確認手機已連上網路')+'</div><button class="b pri" id="re">再試一次</button><button class="b sec" id="back">回到名單</button>';
        $('re').onclick=function(){ send(r,x); }; $('back').onclick=list; });
  }
  if(!M||!PROJ||!R.length){ box.innerHTML='<div class="big">請用手機相機重新掃描會議室螢幕上的「會議簽到 QR Code」。</div><div class="msg" style="color:var(--sub)">（請掃描會議室螢幕上的 QR Code）</div>'+
    (M?'<div class="note">檢查碼：m='+(M?1:0)+' p='+(PROJ?1:0)+' r='+R.length+'。若 r=0，表示會議室電腦的系統是舊版，請更新整合系統檔。</div>':''); return; }
  $('mt').textContent=(TITLE?TITLE+' ':'')+'會議簽到';
  list(); setInterval(function(){ if(box.querySelector('.who')) loadST(); },10000);
})();
</script>
